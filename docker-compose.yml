services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: construction_erp
      POSTGRES_USER: construction_erp
      POSTGRES_PASSWORD: construction_erp
    ports:
      - "5432:5432"
    volumes:
      - construction_erp_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U construction_erp -d construction_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  construction_erp_postgres_data:
